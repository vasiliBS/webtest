<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BigSend Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;450;500;550;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>/* BigSend — High-End Friendly Neo-Fintech Design System (Clean, Bold, Accessible) */
:root {
  --canvas: #f3f5f8;
  --bg: #ffffff;
  --bg-sub: #f8fafc;
  --bg-hover: #f1f5f9;
  --border: rgba(15, 23, 42, 0.08);
  --border-strong: rgba(15, 23, 42, 0.16);
  --line: #edf2f7;
  --line-strong: #e2e8f0;
  --ink: #0f172a;
  --ink-2: #334155;
  --ink-3: #64748b;
  --accent: #0f172a;
  --accent-soft: #f1f5f9;
  --pos: #059669;
  --pos-soft: #ecfdf5;
  --neg: #e11d48;
  --neg-soft: #fff1f2;
  --warn: #d97706;
  --warn-soft: #fffbeb;
  --btn: #0f172a;
  --btn-ink: #ffffff;
  --overlay: rgba(15, 23, 42, 0.5);
  --card-face: linear-gradient(135deg, #1e1b4b 0%, #312e81 40%, #0f172a 100%);
  --card-ink: #ffffff;
  --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 20px 30px -10px rgba(0, 0, 0, 0.08);
  --card-shadow: 0 2px 4px rgba(0, 0, 0, 0.02), 0 10px 24px -4px rgba(15, 23, 42, 0.05);
  --lift: 0 2px 4px rgba(0, 0, 0, 0.04);
  --font: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r-xl: 28px;
  --r-lg: 22px;
  --r: 16px;
  --r-sm: 12px;

  /* Asset brand accents */
  --c-usdt: #26a17b;
  --c-usdt-soft: rgba(38, 161, 123, 0.14);
  --c-usdc: #2775ca;
  --c-usdc-soft: rgba(39, 117, 202, 0.14);
  --c-usd: #059669;
  --c-usd-soft: rgba(5, 150, 105, 0.14);
  --c-eur: #2563eb;
  --c-eur-soft: rgba(37, 99, 235, 0.14);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --canvas: #090b10;
    --bg: #12161f;
    --bg-sub: #181d28;
    --bg-hover: #222938;
    --border: rgba(255, 255, 255, 0.09);
    --border-strong: rgba(255, 255, 255, 0.18);
    --line: #1e2533;
    --line-strong: #2a3346;
    --ink: #f8fafc;
    --ink-2: #cbd5e1;
    --ink-3: #94a3b8;
    --accent: #f8fafc;
    --accent-soft: #1e2535;
    --pos: #10b981;
    --pos-soft: #064e3b;
    --neg: #f43f5e;
    --neg-soft: #4c0519;
    --warn: #fbbf24;
    --warn-soft: #451a03;
    --btn: #f8fafc;
    --btn-ink: #0f172a;
    --overlay: rgba(0, 0, 0, 0.75);
    --card-face: linear-gradient(135deg, #312e81 0%, #1e1b4b 50%, #0f172a 100%);
    --card-ink: #ffffff;
    --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3), 0 24px 45px -10px rgba(0, 0, 0, 0.6);
    --card-shadow: 0 2px 4px rgba(0, 0, 0, 0.2), 0 12px 30px -4px rgba(0, 0, 0, 0.4);
    --lift: 0 2px 4px rgba(0, 0, 0, 0.3);
    color-scheme: dark;
  }
}

:root[data-theme="dark"] {
  --canvas: #090b10;
  --bg: #12161f;
  --bg-sub: #181d28;
  --bg-hover: #222938;
  --border: rgba(255, 255, 255, 0.09);
  --border-strong: rgba(255, 255, 255, 0.18);
  --line: #1e2533;
  --line-strong: #2a3346;
  --ink: #f8fafc;
  --ink-2: #cbd5e1;
  --ink-3: #94a3b8;
  --accent: #f8fafc;
  --accent-soft: #1e2535;
  --pos: #10b981;
  --pos-soft: #064e3b;
  --neg: #f43f5e;
  --neg-soft: #4c0519;
  --warn: #fbbf24;
  --warn-soft: #451a03;
  --btn: #f8fafc;
  --btn-ink: #0f172a;
  --overlay: rgba(0, 0, 0, 0.75);
  --card-face: linear-gradient(135deg, #312e81 0%, #1e1b4b 50%, #0f172a 100%);
  --card-ink: #ffffff;
  --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3), 0 24px 45px -10px rgba(0, 0, 0, 0.6);
  --card-shadow: 0 2px 4px rgba(0, 0, 0, 0.2), 0 12px 30px -4px rgba(0, 0, 0, 0.4);
  --lift: 0 2px 4px rgba(0, 0, 0, 0.3);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--canvas); color: var(--ink);
  font: 16px/1.5 var(--font); -webkit-font-smoothing: antialiased;
  letter-spacing: -0.015em;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 2.5px solid var(--ink); outline-offset: 2px; border-radius: 8px; }
.num { font-variant-numeric: tabular-nums; }
.mono, .font-mono { font-family: var(--mono); font-size: .95em; }
.font-bold { font-weight: 700; }
.grow { flex: 1; min-width: 0; }
h1, h2, h3 { margin: 0; text-wrap: balance; font-weight: 700; letter-spacing: -0.03em; }

/* ---------- App Shell ---------- */
#root { height: 100%; }
.app { display: grid; grid-template-columns: 260px minmax(0, 1fr); height: 100%; }
.side {
  padding: 24px 16px 20px; display: flex; flex-direction: column; gap: 26px;
  overflow-y: auto; background: var(--canvas); border-right: 1px solid var(--border);
}
.brand { display: flex; align-items: center; gap: 12px; padding: 6px 12px; font-weight: 800; font-size: 21px; letter-spacing: -0.04em; color: var(--ink); }
.brand-mark {
  width: 32px; height: 32px; border-radius: 10px; background: var(--ink); position: relative;
  display: flex; align-items: center; justify-content: center; color: var(--bg); font-weight: 900; font-size: 17px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.15);
}
.brand-mark::after { content: ""; position: absolute; right: 6px; top: 6px; width: 7px; height: 7px; border-radius: 50%; background: var(--pos); }
.brand-badge { font-size: 11px; font-weight: 700; text-transform: uppercase; background: var(--pos-soft); padding: 3px 8px; border-radius: 6px; color: var(--pos); margin-left: auto; letter-spacing: .06em; }

.nav { display: flex; flex-direction: column; gap: 18px; }
.nav-group { display: flex; flex-direction: column; gap: 4px; }
.nav-label { font-size: 11.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); padding: 0 12px 6px; font-weight: 700; }
.nav a {
  display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: var(--r); text-decoration: none;
  color: var(--ink-2); font-size: 15px; font-weight: 600; transition: all .15s ease;
}
.nav a:hover { background: var(--bg-hover); color: var(--ink); transform: translateX(2px); }
.nav a.on { background: var(--bg); color: var(--ink); font-weight: 700; box-shadow: var(--lift); border: 1px solid var(--border); }
.nav a .ico { color: var(--ink-3); transition: color .15s; }
.nav a.on .ico { color: var(--ink); }
.nav .lock { margin-left: auto; color: var(--ink-3); }

.side-account { margin-top: auto; position: relative; display: flex; flex-direction: column; gap: 12px; }
.side-tools { display: flex; flex-direction: column; gap: 3px; }
.side-tool {
  display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: var(--r-sm); border: 0; background: transparent;
  color: var(--ink-2); font: inherit; font-size: 14px; font-weight: 600; text-align: left; transition: all .15s;
}
.side-tool .ico { color: var(--ink-3); }
.side-tool:hover, .side-tool.on { background: var(--bg); color: var(--ink); }
.side-tool .count {
  margin-left: auto; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px;
  background: var(--neg); color: #fff; font-size: 11.5px; font-weight: 800; display: grid; place-items: center;
}
.side-me {
  display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: var(--r);
  background: var(--bg); text-decoration: none; color: var(--ink); border: 1px solid var(--border); box-shadow: var(--lift); transition: all .15s;
}
.side-me:hover, .side-me.on { box-shadow: 0 0 0 2px var(--ink); }
.side-me-name { font-size: 14.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---------- Main & Topbar ---------- */
.main { overflow-y: auto; height: 100%; scroll-behavior: smooth; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: 0; z-index: 30; background: color-mix(in srgb, var(--canvas) 90%, transparent);
  backdrop-filter: blur(14px); border-bottom: 1px solid var(--border); padding: 14px 36px;
  display: flex; align-items: center; justify-content: space-between; gap: 18px;
}
.topbar-left { display: flex; align-items: center; gap: 16px; flex: 1; max-width: 520px; }
.topbar-right { display: flex; align-items: center; gap: 12px; margin-left: auto; }

.search {
  flex: 1; display: flex; align-items: center; gap: 12px; background: var(--bg);
  border: 1px solid var(--border); border-radius: 999px; padding: 10px 18px; color: var(--ink-3); box-shadow: var(--lift);
}
.search input { border: 0; background: transparent; outline: 0; width: 100%; color: var(--ink); font-size: 14.5px; }
.kbd {
  font-size: 11px; font-weight: 700; background: var(--bg-sub); border: 1px solid var(--border);
  padding: 3px 7px; border-radius: 6px; color: var(--ink-3); font-family: var(--mono);
}

.net-pill {
  display: flex; align-items: center; gap: 8px; padding: 7px 14px; border-radius: 999px;
  background: var(--bg); border: 1px solid var(--border); font-size: 13px; font-weight: 600; color: var(--ink-2);
}
.pulse-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--pos); box-shadow: 0 0 0 3px var(--pos-soft); animation: pulse 2s infinite; }
@keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.2); opacity: 0.7; } }

.icon-btn {
  width: 42px; height: 42px; display: grid; place-items: center; border-radius: 999px;
  border: 1px solid var(--border); background: var(--bg); color: var(--ink-2); position: relative; transition: all .15s;
}
.icon-btn:hover { background: var(--bg-hover); color: var(--ink); transform: scale(1.04); }
.icon-btn.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.dot { position: absolute; top: 9px; right: 9px; width: 8px; height: 8px; border-radius: 50%; background: var(--neg); border: 2px solid var(--bg); }

.avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--bg-sub); display: grid; place-items: center; font-size: 14px; font-weight: 700; border: 1.5px solid var(--border); }

.page { max-width: 1200px; width: 100%; padding: 28px 36px 90px; margin: 0 auto; flex: 1; }
.view { animation: viewIn .24s cubic-bezier(.16, 1, .3, 1); }
@keyframes viewIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* ---------- Big, Friendly Panels & Cards ---------- */
.panel, .section, .tbl-wrap {
  background: var(--bg); border-radius: var(--r-xl); padding: 28px;
  border: 1px solid var(--border); box-shadow: var(--card-shadow);
}
.tbl-wrap { padding: 12px 18px; }
.panel.sub, :is(.panel, .section, .modal, .drawer) :is(.panel, .section) {
  background: var(--bg-sub); border-radius: var(--r-lg); padding: 22px; border: 1px solid var(--border); box-shadow: none;
}
:is(.panel, .section, .modal, .drawer) .tbl-wrap { background: transparent; padding: 0; border: 0; }

.eyebrow { font-size: 12.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); font-weight: 700; }
.h1 { font-size: 34px; line-height: 1.15; letter-spacing: -0.035em; font-weight: 800; }
.h2 { font-size: 23px; font-weight: 700; }
.h3 { font-size: 18px; letter-spacing: -0.02em; font-weight: 700; }
.muted { color: var(--ink-2); }
.faint { color: var(--ink-3); }
.small { font-size: 14px; }
.xs { font-size: 12.5px; }
.pos { color: var(--pos); }
.neg { color: var(--neg); }

.row { display: flex; align-items: center; gap: 14px; }
.row.wrap { flex-wrap: wrap; }
.between { justify-content: space-between; }
.col { display: flex; flex-direction: column; gap: 14px; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 22px; align-items: start; }
.grid-eq { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
.grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.section { display: flex; flex-direction: column; gap: 16px; }
.sec-head { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.link { background: none; border: 0; padding: 0; color: var(--ink-2); font-size: 14.5px; text-decoration: underline; text-underline-offset: 4px; font-weight: 600; }
.link:hover { color: var(--ink); }
.divider { height: 1px; background: var(--line); border: 0; margin: 6px 0; }

/* ---------- Huge, Clear Action Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px; height: 50px; padding: 0 24px;
  border-radius: 999px; border: 1.5px solid transparent; font-weight: 650; font-size: 15.5px; white-space: nowrap;
  transition: all .16s ease;
}
.btn:active { transform: scale(.97); }
.btn-primary { background: var(--btn); color: var(--btn-ink); border-color: var(--btn); box-shadow: 0 4px 12px rgba(15, 23, 42, 0.15); }
.btn-primary:hover { opacity: .9; transform: translateY(-1px); box-shadow: 0 6px 16px rgba(15, 23, 42, 0.2); }
.btn-primary:disabled { opacity: .35; cursor: not-allowed; transform: none; box-shadow: none; }
.btn-secondary { background: var(--bg); color: var(--ink); border: 1.5px solid var(--border-strong); box-shadow: var(--lift); }
.btn-secondary:hover { background: var(--bg-hover); border-color: var(--ink); }
.btn-ghost { background: transparent; border-color: var(--border-strong); color: var(--ink); }
.btn-ghost:hover { background: var(--bg-hover); }
.btn-sm { height: 38px; padding: 0 16px; font-size: 13.5px; }
.btn-block { width: 100%; }

/* Large Friendly Action Cards */
.actions-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
.action-card {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  padding: 20px 14px; border-radius: var(--r-lg); background: var(--bg-sub); border: 1.5px solid var(--border);
  text-decoration: none; color: var(--ink); font-weight: 700; font-size: 14.5px; transition: all .16s ease;
  box-shadow: var(--lift);
}
.action-card:hover { background: var(--bg); box-shadow: var(--shadow); transform: translateY(-3px); border-color: var(--ink); }
.action-icon {
  width: 52px; height: 52px; border-radius: 50%; background: var(--bg);
  display: grid; place-items: center; border: 1.5px solid var(--border); color: var(--ink); box-shadow: var(--lift);
  transition: transform .2s ease;
}
.action-card:hover .action-icon { transform: scale(1.08); background: var(--ink); color: var(--bg); }
.action-card.dark { background: var(--ink); color: var(--bg); border-color: var(--ink); box-shadow: 0 6px 20px rgba(15, 23, 42, 0.2); }
.action-card.dark .action-icon { background: var(--bg); color: var(--ink); }
.action-card.dark:hover .action-icon { background: var(--pos); color: #fff; }

/* Big Creator Banner */
.creator-banner {
  background: linear-gradient(135deg, rgba(38, 161, 123, 0.12) 0%, rgba(37, 99, 235, 0.08) 100%);
  border: 1.5px solid rgba(38, 161, 123, 0.3); border-radius: var(--r-xl); padding: 22px 28px;
  display: flex; align-items: center; justify-content: space-between; gap: 20px;
}
.creator-badge {
  background: var(--pos); color: #fff; font-weight: 800; font-size: 12px; text-transform: uppercase;
  padding: 4px 10px; border-radius: 999px; letter-spacing: .06em; display: inline-flex; align-items: center; gap: 5px;
}

/* ---------- Plush Multi-currency Account Cards ---------- */
.asset-badge {
  width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center;
  font-weight: 800; font-size: 20px; flex: none; position: relative; color: #fff;
  box-shadow: 0 4px 10px rgba(0,0,0,0.12);
}
.asset-badge.usdt { background: var(--c-usdt); }
.asset-badge.usdc { background: var(--c-usdc); }
.asset-badge.usd { background: var(--c-usd); }
.asset-badge.eur { background: var(--c-eur); }

.acc-card {
  display: flex; flex-direction: column; justify-content: space-between; gap: 16px; padding: 22px;
  border-radius: var(--r-lg); background: var(--bg); border: 1.5px solid var(--border); text-decoration: none;
  color: var(--ink); box-shadow: var(--lift); transition: all .16s ease;
}
.acc-card:hover { transform: translateY(-3px); box-shadow: var(--shadow); border-color: var(--border-strong); }
.acc-card-top { display: flex; align-items: center; justify-content: space-between; }
.acc-card-amt { font-size: 24px; font-weight: 800; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }

/* ---------- Lists & Rows ---------- */
.list { display: flex; flex-direction: column; }
.li {
  display: grid; grid-template-columns: 46px minmax(0, 1fr) auto; align-items: center; gap: 16px; padding: 14px 12px; margin: 0 -12px;
  border-radius: var(--r); border: 0; background: transparent; text-align: left; width: calc(100% + 24px); transition: background .12s;
}
button.li:hover, a.li:hover { background: var(--bg-hover); }
a.li { text-decoration: none; }
.li-main { min-width: 0; }
.li-title { font-weight: 650; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.li-sub { font-size: 13.5px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.li-end { text-align: right; }
.li-amt { font-weight: 700; font-size: 15.5px; font-variant-numeric: tabular-nums; }
.day { font-size: 12px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .08em; padding: 18px 0 6px; font-weight: 700; }
.day:first-child { padding-top: 0; }

.tx-ico { width: 44px; height: 44px; border-radius: 50%; background: var(--bg-sub); display: grid; place-items: center; color: var(--ink-2); flex: none; border: 1.5px solid var(--border); }

/* ---------- Badges & Status ---------- */
.badge { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 999px; font-size: 12.5px; font-weight: 650; background: var(--bg-sub); color: var(--ink-2); border: 1px solid var(--border); }
.badge.ok { background: var(--pos-soft); color: var(--pos); border-color: transparent; }
.badge.wait { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.badge.bad { background: var(--neg-soft); color: var(--neg); border-color: transparent; }
.badge.info { background: var(--accent-soft); color: var(--accent); border-color: transparent; }

/* ---------- Large Forms & Big Inputs ---------- */
.field { display: flex; flex-direction: column; gap: 8px; }
.field label, .lbl { font-size: 14px; font-weight: 650; color: var(--ink-2); }
.input {
  height: 54px; border-radius: var(--r); border: 1.5px solid var(--border-strong); background: var(--bg); padding: 0 18px;
  outline: 0; transition: all .15s; width: 100%; min-width: 0; font-size: 16px; font-weight: 550;
}
:is(.panel, .section, .modal, .drawer) .input { background: var(--bg-sub); border-color: var(--border); }
.input:focus, :is(.panel, .section, .modal, .drawer) .input:focus { border-color: var(--ink); background: var(--bg); box-shadow: 0 0 0 2px var(--ink); }
.input.locked { background: var(--bg-hover) !important; color: var(--ink-2); border-color: transparent !important; }
.input.err { border-color: var(--neg) !important; }
.hint { font-size: 13px; color: var(--ink-3); font-weight: 500; }
.hint.err { color: var(--neg); font-weight: 600; }
.hint.ok { color: var(--pos); font-weight: 600; }

.amount-box {
  display: flex; align-items: baseline; gap: 12px; background: var(--bg-sub); border: 1.5px solid var(--border);
  border-radius: var(--r-lg); padding: 22px 24px; transition: border-color .15s;
}
.amount-box:focus-within { border-color: var(--ink); box-shadow: 0 0 0 2px var(--ink); background: var(--bg); }
.amount-box input { border: 0; outline: 0; background: transparent; font-size: 48px; font-weight: 750; letter-spacing: -0.04em; width: 100%; min-width: 0; font-variant-numeric: tabular-nums; padding: 0; }
.amount-box .cur { font-size: 22px; color: var(--ink-2); font-weight: 700; flex: none; }

.tile { background: var(--bg-sub); border: 1.5px solid var(--border); border-radius: var(--r-lg); padding: 20px 24px; }
.tile:focus-within { border-color: var(--ink); box-shadow: 0 0 0 2px var(--ink); background: var(--bg); }
.tile .amount-box { background: transparent; padding: 6px 0 0; border: 0; box-shadow: none; }
.swap-btn {
  width: 50px; height: 50px; border-radius: 50%; border: 4px solid var(--bg); background: var(--bg-sub);
  display: grid; place-items: center; color: var(--ink); box-shadow: var(--shadow); transition: transform .25s ease;
}
.swap-btn:hover { transform: rotate(180deg) scale(1.06); }

.seg { display: inline-flex; padding: 4px; border-radius: 999px; background: var(--bg-sub); border: 1.5px solid var(--border); gap: 3px; }
.seg button { border: 0; background: transparent; height: 36px; padding: 0 16px; border-radius: 999px; font-size: 14px; color: var(--ink-2); font-weight: 600; transition: all .15s; }
.seg button.on { background: var(--ink); color: var(--bg); font-weight: 700; box-shadow: var(--lift); }

.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { height: 38px; padding: 0 16px; border-radius: 999px; border: 1.5px solid var(--border); background: var(--bg); font-size: 14px; color: var(--ink-2); font-weight: 600; transition: all .15s; }
.chip:hover { color: var(--ink); border-color: var(--ink); }
.chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.pct { display: flex; gap: 8px; }

.toggle { width: 44px; height: 26px; border-radius: 999px; background: var(--line-strong); border: 0; position: relative; transition: background .18s; flex: none; padding: 0; }
.toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .18s; box-shadow: 0 1px 3px rgba(0,0,0,.25); }
.toggle.on { background: var(--accent); }
.toggle.on::after { transform: translateX(18px); }

.otp { display: flex; gap: 10px; justify-content: center; }
.otp input { width: 54px; height: 64px; text-align: center; font-size: 24px; font-weight: 700; border-radius: var(--r); border: 1.5px solid var(--border-strong); background: var(--bg-sub); outline: 0; font-variant-numeric: tabular-nums; }
.otp input:focus { border-color: var(--ink); box-shadow: 0 0 0 2px var(--ink); }

/* ---------- KV & Banners ---------- */
.kv { display: flex; flex-direction: column; }
.kv > div { display: flex; justify-content: space-between; gap: 18px; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.kv > div:last-child { border-bottom: 0; }
.kv .k { color: var(--ink-2); font-weight: 500; }
.kv .v { text-align: right; font-variant-numeric: tabular-nums; font-weight: 650; }
.kv .total { font-weight: 800; font-size: 17px; }

.banner { display: flex; align-items: center; gap: 16px; padding: 18px 22px; border-radius: var(--r-lg); background: var(--warn-soft); color: var(--ink); border: 1.5px solid rgba(217, 119, 6, 0.25); }
.banner.info { background: var(--accent-soft); border-color: var(--border); }
.banner.bad { background: var(--neg-soft); border-color: rgba(220, 38, 38, 0.25); }

/* ---------- Popovers ---------- */
.pop { position: absolute; top: 52px; right: 0; width: 360px; background: var(--bg); border: 1.5px solid var(--border); border-radius: var(--r); box-shadow: var(--shadow); padding: 12px; z-index: 40; animation: modalIn .18s ease; }
.pop .li { margin: 0; width: 100%; }
.pop.side-pop { position: fixed; top: auto; right: auto; bottom: 18px; left: 270px; max-height: calc(100vh - 36px); overflow-y: auto; }

/* ---------- Modal & Drawer ---------- */
.overlay { position: fixed; inset: 0; background: var(--overlay); z-index: 60; display: grid; place-items: center; padding: 24px; animation: fadeIn .18s ease; backdrop-filter: blur(6px); }
.overlay.closing { animation: fadeOut .16s ease forwards; }
.modal { width: min(520px, 100%); max-height: calc(100vh - 48px); overflow-y: auto; background: var(--bg); border-radius: var(--r-xl); box-shadow: var(--shadow); border: 1.5px solid var(--border); padding: 32px; animation: modalIn .24s cubic-bezier(.16,1,.3,1); }
.modal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; margin-bottom: 22px; }
.drawer-wrap { place-items: stretch end; padding: 0; }
.drawer { width: min(480px, 100%); height: 100%; background: var(--bg); box-shadow: var(--shadow); border-left: 1.5px solid var(--border); padding: 32px; overflow-y: auto; animation: drawerIn .24s cubic-bezier(.16,1,.3,1); }

/* ---------- Toasts ---------- */
.toasts { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%); z-index: 90; display: flex; flex-direction: column; gap: 10px; align-items: center; pointer-events: none; }
.toast { background: var(--btn); color: var(--btn-ink); padding: 13px 24px; border-radius: 999px; font-size: 14.5px; font-weight: 650; box-shadow: var(--shadow); animation: toastIn .24s cubic-bezier(.16,1,.3,1); display: flex; gap: 10px; align-items: center; }

/* ---------- Chart & Hero ---------- */
.hero-bal { font-size: 60px; font-weight: 800; letter-spacing: -0.045em; line-height: 1.05; font-variant-numeric: tabular-nums; }
.hero-bal .cents { color: var(--ink-3); font-weight: 600; font-size: 0.8em; }
.hero-delta { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; font-size: 13.5px; font-weight: 700; }
.hero-delta.pos { background: var(--pos-soft); color: var(--pos); }
.hero-delta.neg { background: var(--neg-soft); color: var(--neg); }

.chart { width: 100%; height: 170px; display: block; overflow: visible; }

/* ---------- Card Face (NovaPay Luxury Style) ---------- */
.card-vis {
  width: 100%; max-width: 420px; aspect-ratio: 1.586; border-radius: 22px; background: var(--card-face);
  color: var(--card-ink); padding: 26px; display: flex; flex-direction: column; justify-content: space-between;
  position: relative; overflow: hidden; box-shadow: 0 16px 40px -6px rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.15);
}
.card-vis::before {
  content: ""; position: absolute; inset: -50%;
  background: conic-gradient(from 180deg at 50% 50%, rgba(255,255,255,0.08) 0deg, transparent 180deg, rgba(255,255,255,0.12) 360deg);
  pointer-events: none;
}
.card-vis.frozen { filter: grayscale(1); opacity: .6; }
.card-vis .chipm { width: 40px; height: 28px; border-radius: 7px; border: 1.5px solid rgba(255,255,255,0.4); background: linear-gradient(135deg, rgba(255,255,255,0.3), rgba(255,255,255,0.08)); }
.card-vis .pan { font-family: var(--mono); font-size: 20px; letter-spacing: .12em; font-weight: 650; }

.card-mini {
  width: 82px; aspect-ratio: 1.586; border-radius: 8px; background: var(--card-face);
  color: #fff; font-size: 10px; padding: 7px 8px; display: flex; flex-direction: column;
  justify-content: flex-end; font-family: var(--mono); font-weight: 700; box-shadow: 0 4px 10px rgba(0,0,0,0.15);
}

.wallet-btn {
  height: 50px; border-radius: 999px; border: 1.5px solid var(--border); background: var(--bg);
  display: inline-flex; align-items: center; justify-content: center; gap: 10px; font-weight: 700; font-size: 15px;
  box-shadow: var(--lift); transition: all .15s;
}
.wallet-btn:hover { background: var(--bg-hover); transform: translateY(-1px); }

/* ---------- Receipt Modal ---------- */
.receipt-paper {
  background: var(--bg); border: 1.5px solid var(--border); border-radius: var(--r-lg);
  padding: 28px; display: flex; flex-direction: column; gap: 18px; position: relative;
}
.receipt-header { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.receipt-stamp {
  font-size: 12px; text-transform: uppercase; letter-spacing: .12em; font-weight: 800;
  padding: 5px 12px; border-radius: 6px; border: 2px dashed var(--pos); color: var(--pos);
}

/* ---------- Stepper & Timeline ---------- */
.stepper { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--ink-3); flex-wrap: wrap; }
.stepper span.on { color: var(--ink); font-weight: 700; }
.stepper span.done { color: var(--ink-2); }
.stepper .sep { width: 18px; height: 1.5px; background: var(--line-strong); }

.timeline { display: flex; flex-direction: column; }
.tl { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; gap: 14px; position: relative; padding-bottom: 20px; }
.tl:last-child { padding-bottom: 0; }
.tl::before { content: ""; position: absolute; left: 11px; top: 24px; bottom: 0; width: 2px; background: var(--line); }
.tl:last-child::before { display: none; }
.tl.done::before { background: var(--ink); }
.tl-dot { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--line-strong); background: var(--bg); display: grid; place-items: center; transition: all .3s; z-index: 1; }
.tl.done .tl-dot { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.tl.now .tl-dot { border-color: var(--ink); }
.tl.now .tl-dot::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--ink); animation: pulse 1.2s ease-in-out infinite; }
.tl-title { font-weight: 650; }

.progress { height: 8px; border-radius: 999px; background: var(--line); overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--ink); border-radius: 999px; transition: width .35s ease; }

.tbl-wrap { overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 14.5px; }
.tbl th { text-align: left; font-weight: 600; color: var(--ink-3); font-size: 12.5px; text-transform: uppercase; letter-spacing: .06em; padding: 12px; border-bottom: 1px solid var(--line); }
.tbl td { padding: 14px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl .r { text-align: right; font-variant-numeric: tabular-nums; }

.method {
  display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; gap: 16px; align-items: center;
  padding: 18px 20px; border-radius: var(--r-lg); border: 1.5px solid var(--border); background: var(--bg);
  box-shadow: var(--lift); text-align: left; transition: all .16s ease; width: 100%;
}
.method:hover { border-color: var(--ink); transform: translateY(-2px); box-shadow: var(--shadow); }
.method.on { border-color: var(--ink); box-shadow: 0 0 0 2px var(--ink); }

.qr { width: 200px; height: 200px; padding: 14px; background: #fff; border-radius: var(--r-lg); box-shadow: 0 0 0 1px var(--border); }
.qr svg { width: 100%; height: 100%; display: block; }
.addr { font-family: var(--mono); font-size: 14px; overflow-wrap: anywhere; background: var(--bg-sub); padding: 14px 16px; border-radius: var(--r); border: 1.5px solid var(--border); }

.empty { text-align: center; padding: 48px 24px; color: var(--ink-2); display: flex; flex-direction: column; gap: 12px; align-items: center; }
.locked-view { max-width: 560px; margin: 40px auto; padding: 44px 36px; background: var(--bg); border: 1.5px solid var(--border); border-radius: var(--r-xl); text-align: center; display: flex; flex-direction: column; gap: 16px; align-items: center; box-shadow: var(--card-shadow); }
.big-ico { width: 64px; height: 64px; border-radius: 50%; background: var(--bg-sub); display: grid; place-items: center; color: var(--ink); border: 1.5px solid var(--border); }
.big-ico.ok { background: var(--pos-soft); color: var(--pos); border-color: transparent; }
.big-ico.wait { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.big-ico.bad { background: var(--neg-soft); color: var(--neg); border-color: transparent; }

.narrow { max-width: 620px; margin: 0 auto; }
.slider { width: 100%; accent-color: var(--ink); }

/* ---------- Bottom Nav (Mobile) ---------- */
.bottom-nav { display: none; }

@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; }
  .side { display: none; }
  .topbar { padding: 12px 18px; }
  .page { padding: 18px 18px 100px; }
  .grid2, .grid-eq, .grid4 { grid-template-columns: 1fr; }
  .hero-bal { font-size: 46px; }
  .actions-grid { grid-template-columns: repeat(2, 1fr); }
  
  .bottom-nav {
    display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; bottom: 0; left: 0; right: 0;
    height: 68px; background: var(--bg); border-top: 1.5px solid var(--border); z-index: 50; padding: 0 6px;
    box-shadow: 0 -6px 20px rgba(0, 0, 0, 0.08);
  }
  .b-tab {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    text-decoration: none; color: var(--ink-3); font-size: 11.5px; font-weight: 600;
  }
  .b-tab.on { color: var(--ink); font-weight: 750; }
}

@keyframes fadeIn { from { opacity: 0; } }
@keyframes fadeOut { to { opacity: 0; } }
@keyframes modalIn { from { opacity: 0; transform: translateY(14px) scale(.98); } }
@keyframes drawerIn { from { transform: translateX(36px); opacity: 0; } }

/* ---------- Print Styles for Official Receipt ---------- */
@media print {
  body {
    background: #fff !important;
    color: #000 !important;
  }
  .side, .topbar, .bottom-nav, .toasts, .modal-head button, .overlay:not(:has(.receipt-paper)), .btn {
    display: none !important;
  }
  .overlay {
    position: static !important;
    background: transparent !important;
    padding: 0 !important;
  }
  .modal {
    box-shadow: none !important;
    border: 0 !important;
    padding: 0 !important;
    width: 100% !important;
    max-height: none !important;
    background: transparent !important;
  }
  .receipt-paper {
    border: 2px solid #000 !important;
    box-shadow: none !important;
    background: #fff !important;
    color: #000 !important;
  }
  .receipt-paper * {
    color: #000 !important;
  }
}
